spring.application.name=order-service

#using config server configuration from github
spring.config.import=optional:configserver:http://localhost:8888


# Kafka Cluster
spring.kafka.bootstrap-servers=localhost:9092

# Key Serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Value Serializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all


#consumer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.dto.PaymentStatusEvent

# Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Logging Pattern
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

